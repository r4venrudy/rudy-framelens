<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Rudy FrameLens</title><desc id="desc">Follow every boundary. Keep the payload private. Native Go HTTP framing investigations.</desc><rect width="1200" height="310" rx="16" fill="#0a111a"/><path d="M2 16Q2 2 16 2V308Q2 308 2 294Z" fill="#55e0b6"/><g stroke="#182b3b" opacity=".6"><path d="M850 0V310M900 0V310M950 0V310M1000 0V310M1050 0V310M1100 0V310M1150 0V310M820 55H1200M820 105H1200M820 155H1200M820 205H1200M820 255H1200"/></g><text x="44" y="45" fill="#55e0b6" font-family="monospace" font-size="13" letter-spacing="3">RUDY SYSTEMS / HTTP FRAMING INVESTIGATIONS</text><text x="44" y="116" fill="#edf5ff" font-family="Arial,sans-serif" font-size="54" font-weight="700">Rudy FrameLens</text><text x="44" y="162" fill="#a4b8d0" font-family="Arial,sans-serif" font-size="24">Follow every boundary. Keep the payload private.</text><text x="44" y="199" fill="#a4b8d0" font-family="Arial,sans-serif" font-size="19">Byte ranges, transfer decoding, and reviewable request projections.</text><path d="M44 242H1156" stroke="#26384a"/><text x="44" y="279" fill="#55e0b6" font-family="monospace" font-size="15">GO / STANDARD LIBRARY / OFFLINE / READ ONLY</text><g fill="#101e2b" stroke="#2e465c"><rect x="890" y="56" width="258" height="45" rx="6"/><rect x="890" y="121" width="258" height="45" rx="6"/><rect x="890" y="186" width="258" height="36" rx="6"/></g><g fill="#55e0b6" font-family="monospace" font-size="13" text-anchor="middle"><text x="1019" y="84">HEADER / BODY / NEXT REQUEST</text><text x="1019" y="149">TRANSFER-DECODED IDENTITY</text><text x="1019" y="209">PROJECTION / WIRE CHANGES</text></g><path d="M1019 101V119M1014 113L1019 119L1024 113M1019 166V184M1014 178L1019 184L1024 178" fill="none" stroke="#55e0b6"/><text x="1156" y="279" fill="#9eb5cc" text-anchor="end" font-family="monospace" font-size="13">DEVELOPER PREVIEW</text></svg>
